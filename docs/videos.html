<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BREAD Computer Repair | BREAD Videos</title>
    <style>
      :root {
        --bg: #060b14;
        --panel: rgba(10, 18, 32, 0.92);
        --panel-strong: #101a2d;
        --text: #f4f7ff;
        --muted: #94a7c6;
        --accent: #2ea8ff;
        --accent-strong: #4ce3ff;
        --border: rgba(78, 168, 255, 0.35);
        --success: #39d98a;
        --shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(46, 168, 255, 0.22), transparent 28%),
          radial-gradient(circle at bottom right, rgba(76, 227, 255, 0.18), transparent 30%),
          var(--bg);
        min-height: 100vh;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.03), transparent 45%);
        pointer-events: none;
      }

      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px 10%;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .logo {
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        color: var(--accent-strong);
      }

      nav .nav-links {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.8rem 1.2rem;
      }

      nav a {
        color: var(--text);
        text-decoration: none;
        transition: color 0.25s ease;
      }

      nav a:hover {
        color: var(--accent);
      }

      .page-shell {
        width: min(1200px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 2rem 0 4rem;
      }

      .hero {
        background: linear-gradient(145deg, rgba(16, 26, 45, 0.95), rgba(8, 15, 27, 0.95));
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        border-radius: 28px;
        padding: 2rem;
        position: relative;
        overflow: hidden;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: auto auto -60px -60px;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(46, 168, 255, 0.25), transparent 70%);
        filter: blur(20px);
      }

      .hero h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        margin: 0 0 0.6rem;
      }

      .hero p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
        max-width: 780px;
      }

      .video-toolbar {
        margin-top: 1.4rem;
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
      }

      .search-wrap {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 999px;
        padding: 0.8rem 1rem;
        max-width: 640px;
      }

      .search-wrap input {
        width: 100%;
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 1rem;
        outline: none;
      }

      .search-wrap input::placeholder {
        color: var(--muted);
      }

      .category-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem;
      }

      .category-btn {
        background: rgba(255,255,255,0.04);
        color: var(--text);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 999px;
        padding: 0.7rem 1rem;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s ease;
      }

      .category-btn:hover,
      .category-btn.active {
        background: linear-gradient(135deg, rgba(46, 168, 255, 0.2), rgba(76, 227, 255, 0.14));
        border-color: var(--accent);
        color: var(--text);
      }

      .content-block {
        margin-top: 2rem;
      }

      .video-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1.2rem;
      }

      .video-card {
        display: flex;
        flex-direction: column;
        background: linear-gradient(145deg, rgba(16, 26, 45, 0.95), rgba(9, 16, 29, 0.95));
        border: 1px solid var(--border);
        border-radius: 22px;
        overflow: hidden;
        text-decoration: none;
        color: var(--text);
        box-shadow: var(--shadow);
        transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      }

      .video-card:hover {
        transform: translateY(-6px);
        border-color: var(--accent-strong);
        box-shadow: 0 22px 55px rgba(46, 168, 255, 0.18);
      }

      .video-thumbnail {
        position: relative;
        aspect-ratio: 16 / 9;
        background-size: cover;
        background-position: center;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }

      .video-thumbnail::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(6,11,20,0.1), rgba(6,11,20,0.6));
      }

      .play-badge {
        position: absolute;
        left: 1rem;
        bottom: 1rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: rgba(8, 14, 24, 0.8);
        border: 1px solid rgba(255,255,255,0.16);
        color: var(--accent-strong);
        font-size: 1.1rem;
        z-index: 1;
      }

      .video-body {
        padding: 1rem 1rem 1.1rem;
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
        flex: 1;
      }

      .video-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.78rem;
        color: var(--accent-strong);
        font-weight: 700;
      }

      .video-card h3 {
        margin: 0;
        font-size: 1.12rem;
        line-height: 1.4;
      }

      .video-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .recommended-label {
        margin-top: 0.25rem;
        font-size: 0.72rem;
        color: var(--accent-strong);
        letter-spacing: 0.04em;
        text-transform: none;
        display: block;
      }

      .recommended-text {
        font-size: 0.81rem;
        color: var(--muted);
      }

      .empty-state {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 18px;
        padding: 2rem 1.2rem;
        text-align: center;
        color: var(--muted);
        font-size: 1.05rem;
      }

      footer {
        padding: 32px 20px 40px;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 980px) {
        .video-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 700px) {
        nav {
          padding: 20px 5%;
        }

        .hero {
          padding: 1.5rem 1rem;
        }

        .video-grid {
          grid-template-columns: 1fr;
        }

        .search-wrap {
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="logo">BREAD</div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="news.html">News</a>
        <a href="videos.html">BREAD Videos</a>
        <a href="request-repair.html">Request a Repair</a>
        <a href="buy-gift-card.html">Buy a Gift Card</a>
        <a href="download.html">Download</a>
      </div>
    </nav>

    <main class="page-shell">
      <section class="hero">
        <h1>BREAD Videos</h1>
        <p>Helpful videos, tutorials, updates, and behind-the-scenes content from BREAD Computer Repair.</p>

        <div class="video-toolbar">
          <div class="search-wrap">
            <span aria-hidden="true">🔎</span>
            <input id="videoSearch" type="search" placeholder="Search videos, categories, and recommendations" aria-label="Search BREAD Videos" />
          </div>
          <div id="categoryFilters" class="category-row" aria-label="Video categories"></div>
        </div>
      </section>

      <section class="content-block">
        <div id="videoGrid" class="video-grid" aria-live="polite"></div>
        <div id="emptyState" class="empty-state" hidden>No BREAD Videos found.</div>
      </section>
    </main>

    <footer>© BREAD Computer Repair</footer>

    <script>
      const categoryOrder = [
        "All",
        "Tutorials",
        "PC Maintenance",
        "Repairs",
        "BREAD News",
        "Behind the Scenes",
        "Tips & Tricks"
      ];

      const state = {
        videos: [],
        selectedCategory: "All",
        query: ""
      };

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function renderCategoryFilters() {
        const available = [...new Set(state.videos.map((video) => video.category).filter(Boolean))];
        const categories = categoryOrder.filter((category) => category === "All" || available.includes(category));

        document.getElementById("categoryFilters").innerHTML = categories
          .map((category) => {
            const activeClass = state.selectedCategory === category ? "active" : "";
            return `<button type="button" class="category-btn ${activeClass}" data-category="${category.replace(/"/g, "&quot;")}">${escapeHtml(category)}</button>`;
          })
          .join("");

        document.querySelectorAll(".category-btn").forEach((button) => {
          button.addEventListener("click", () => {
            state.selectedCategory = button.dataset.category;
            renderCategoryFilters();
            renderVideos();
          });
        });
      }

      function renderVideos() {
        const searchTerm = state.query.trim().toLowerCase();
        const filteredVideos = state.videos.filter((video) => {
          const categoryMatch = state.selectedCategory === "All" || (video.category || "") === state.selectedCategory;
          const searchableText = [
            video.title,
            video.description,
            video.category,
            video.recommendedIf
          ]
            .join(" ")
            .toLowerCase();
          const searchMatch = !searchTerm || searchableText.includes(searchTerm);
          return categoryMatch && searchMatch;
        });

        const grid = document.getElementById("videoGrid");
        const emptyState = document.getElementById("emptyState");

        if (!filteredVideos.length) {
          grid.innerHTML = "";
          emptyState.hidden = false;
          return;
        }

        emptyState.hidden = true;

        grid.innerHTML = filteredVideos
          .map((video) => {
            const videoId = encodeURIComponent(video.id || video.title || "video");
            const thumbnail = video.thumbnail || "images/videos/placeholder.svg";
            const title = escapeHtml(video.title || "Untitled video");
            const description = escapeHtml(video.description || "A BREAD video is being prepared.");
            const category = escapeHtml(video.category || "General");
            const date = escapeHtml(video.date || "Coming soon");
            const recommendedIf = escapeHtml(video.recommendedIf || "You want to learn more about BREAD Computer Repair.");

            return `
              <a class="video-card" href="watch-video.html?id=${videoId}" aria-label="Open ${title}">
                <div class="video-thumbnail" style="background-image: url('${thumbnail}');">
                  <span class="play-badge">▶</span>
                </div>
                <div class="video-body">
                  <div class="video-meta">
                    <span>${category}</span>
                    <span>${date}</span>
                  </div>
                  <h3>${title}</h3>
                  <p>${description}</p>
                  <div>
                    <span class="recommended-label">Recommended if:</span>
                    <p class="recommended-text">${recommendedIf}</p>
                  </div>
                </div>
              </a>
            `;
          })
          .join("");
      }

      async function loadVideos() {
        try {
          const response = await fetch("videos.json", { cache: "no-store" });
          if (!response.ok) {
            throw new Error("Unable to load videos data.");
          }

          const data = await response.json();
          state.videos = Array.isArray(data) ? data : [];
        } catch (error) {
          state.videos = [];
        }

        renderCategoryFilters();
        renderVideos();
      }

      document.getElementById("videoSearch").addEventListener("input", (event) => {
        state.query = event.target.value;
        renderVideos();
      });

      loadVideos();
    </script>
  </body>
</html>
