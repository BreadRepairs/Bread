<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BREAD Videos</title>
    <style>
      :root {
        --bg: #060b14;
        --text: #f4f7ff;
        --muted: #94a7c6;
        --accent: #2ea8ff;
        --accent-strong: #4ce3ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg);
      }

      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
        padding: 24px 10%;
      }

      .logo {
        color: var(--accent-strong);
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: 0.16em;
      }

      .nav-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem 1.2rem;
      }

      nav a {
        color: var(--text);
        text-decoration: none;
      }

      nav a:hover {
        color: var(--accent);
      }

      main {
        width: min(1200px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 3rem 0;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      #videoContent {
        color: var(--muted);
        line-height: 1.7;
      }

      .video-tools {
        display: grid;
        gap: 1rem;
        margin: 1.5rem 0;
      }

      .video-search {
        width: 100%;
        max-width: 640px;
        padding: 0.85rem 1rem;
        border: 1px solid rgba(78, 168, 255, 0.35);
        border-radius: 12px;
        color: var(--text);
        background: rgba(255,255,255,0.04);
        font: inherit;
      }

      .category-filters {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
      }

      .category-button {
        padding: 0.65rem 0.95rem;
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 999px;
        color: var(--text);
        background: rgba(255,255,255,0.04);
        font: inherit;
        cursor: pointer;
      }

      .category-button[aria-pressed="true"] {
        border-color: var(--accent);
        background: rgba(46, 168, 255, 0.16);
      }

      .video-list {
        display: grid;
        gap: 1rem;
      }

      .video-entry {
        padding: 1rem 0;
        border-bottom: 1px solid rgba(78, 168, 255, 0.22);
      }

      .video-entry h2 {
        margin: 0 0 0.5rem;
        color: var(--text);
        font-size: 1.2rem;
      }

      .video-entry p {
        margin: 0.4rem 0;
      }

      .video-entry a,
      .back-link {
        color: var(--accent-strong);
      }

      .recommended-label {
        color: var(--accent-strong);
        font-size: 0.9rem;
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 700px) {
        nav {
          padding: 20px 5%;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="logo">BREAD</div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="news.html">News</a>
        <a href="videos.html">BREAD Videos</a>
        <a href="request-repair.html">Request a Repair</a>
        <a href="buy-gift-card.html">Buy a Gift Card</a>
        <a href="download.html">Download</a>
      </div>
    </nav>

    <main>
      <h1>BREAD Videos</h1>
      <div id="videoContent" aria-live="polite">Videos are coming soon. Check back later!</div>
      <div id="videoTools" class="video-tools" hidden>
        <input id="videoSearch" class="video-search" type="search" placeholder="Search videos" aria-label="Search BREAD Videos" />
        <div id="categoryFilters" class="category-filters" aria-label="Video categories"></div>
      </div>
      <div id="videoList" class="video-list"></div>
    </main>

    <script>
      const content = document.getElementById("videoContent");
      const tools = document.getElementById("videoTools");
      const videoList = document.getElementById("videoList");
      const categoryFilters = document.getElementById("categoryFilters");
      const searchInput = document.getElementById("videoSearch");
      let videos = [];
      let selectedCategory = "All";

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function renderCategories() {
        const categories = ["All", ...new Set(videos.map((video) => video.category).filter(Boolean))];
        categoryFilters.innerHTML = categories.map((category) => {
          const safeCategory = escapeHtml(category);
          const pressed = category === selectedCategory ? "true" : "false";
          return `<button class="category-button" type="button" data-category="${safeCategory}" aria-pressed="${pressed}">${safeCategory}</button>`;
        }).join("");

        categoryFilters.querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", () => {
            selectedCategory = button.dataset.category;
            renderCategories();
            renderVideos();
          });
        });
      }

      function renderVideos() {
        const term = searchInput.value.trim().toLowerCase();
        const matchingVideos = videos.filter((video) => {
          const categoryMatch = selectedCategory === "All" || video.category === selectedCategory;
          const text = [video.title, video.description, video.category, video.recommendedIf].join(" ").toLowerCase();
          return categoryMatch && (!term || text.includes(term));
        });

        if (!matchingVideos.length) {
          videoList.textContent = "No BREAD Videos found.";
          return;
        }

        videoList.innerHTML = matchingVideos.map((video) => {
          const id = encodeURIComponent(video.id || video.title || "");
          return `
            <article class="video-entry">
              <h2><a href="watch-video.html?id=${id}">${escapeHtml(video.title)}</a></h2>
              <p>${escapeHtml(video.description)}</p>
              <p>${escapeHtml(video.category)} · ${escapeHtml(video.date)}</p>
              <p><span class="recommended-label">Recommended if:</span> ${escapeHtml(video.recommendedIf)}</p>
            </article>
          `;
        }).join("");
      }

      async function videoFileExists(path) {
        if (!path) return false;
        try {
          const response = await fetch(path, { method: "HEAD" });
          return response.ok;
        } catch {
          return false;
        }
      }

      async function loadVideos() {
        try {
          const response = await fetch("videos.json", { cache: "no-store" });
          if (!response.ok) throw new Error("Video data unavailable");
          const data = await response.json();
          const entries = Array.isArray(data)
            ? data.filter((video) => video && video.id && video.video && video.title)
            : [];
          videos = (await Promise.all(entries.map(async (video) =>
            await videoFileExists(video.video) ? video : null
          ))).filter(Boolean);
        } catch {
          videos = [];
        }

        if (!videos.length) {
          content.textContent = "Videos are coming soon. Check back later!";
          tools.hidden = true;
          videoList.replaceChildren();
          return;
        }

        content.textContent = "Helpful videos, tutorials, updates, and behind-the-scenes content from BREAD Computer Repair.";
        tools.hidden = false;
        renderCategories();
        renderVideos();
      }

      searchInput.addEventListener("input", renderVideos);
      loadVideos();
    </script>
  </body>
</html>
