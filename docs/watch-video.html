<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BREAD Computer Repair | Watch Video</title>
    <style>
      :root {
        --bg: #060b14;
        --panel: rgba(10, 18, 32, 0.92);
        --panel-strong: #101a2d;
        --text: #f4f7ff;
        --muted: #94a7c6;
        --accent: #2ea8ff;
        --accent-strong: #4ce3ff;
        --border: rgba(78, 168, 255, 0.35);
        --shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(46, 168, 255, 0.2), transparent 28%),
          radial-gradient(circle at bottom right, rgba(76, 227, 255, 0.16), transparent 30%),
          var(--bg);
        min-height: 100vh;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.03), transparent 45%);
        pointer-events: none;
      }

      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px 10%;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .logo {
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        color: var(--accent-strong);
      }

      .nav-links {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.8rem 1.2rem;
      }

      nav a {
        color: var(--text);
        text-decoration: none;
        transition: color 0.25s ease;
      }

      nav a:hover {
        color: var(--accent);
      }

      .page-shell {
        width: min(1180px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 2rem 0 4rem;
      }

      .page-hero {
        background: linear-gradient(145deg, rgba(16, 26, 45, 0.95), rgba(8, 15, 27, 0.95));
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        border-radius: 28px;
        padding: 2rem;
        position: relative;
        overflow: hidden;
      }

      .page-hero::after {
        content: "";
        position: absolute;
        inset: auto auto -60px -60px;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(46, 168, 255, 0.25), transparent 70%);
        filter: blur(20px);
      }

      .page-hero-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.2rem;
        flex-wrap: wrap;
      }

      .brand {
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: var(--accent-strong);
        text-transform: uppercase;
      }

      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        text-decoration: none;
        color: var(--text);
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 999px;
        padding: 0.7rem 1rem;
        transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
      }

      .back-btn:hover {
        transform: translateY(-2px);
        background: rgba(46, 168, 255, 0.16);
        border-color: var(--accent);
      }

      .video-shell {
        margin-top: 2rem;
        display: grid;
        grid-template-columns: minmax(0, 2.2fr) minmax(280px, 1fr);
        gap: 1.5rem;
      }

      .video-panel,
      .info-panel,
      .related-panel {
        background: linear-gradient(145deg, rgba(16, 26, 45, 0.95), rgba(9, 16, 29, 0.95));
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      .video-panel {
        overflow: hidden;
      }

      .video-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #0b1220;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .video-frame video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #050a13;
      }

      .coming-soon {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        background: radial-gradient(circle at top, rgba(46, 168, 255, 0.2), transparent 35%), #0a111a;
      }

      .coming-soon-badge {
        display: inline-block;
        background: rgba(46, 168, 255, 0.12);
        border: 1px solid rgba(78, 168, 255, 0.28);
        border-radius: 999px;
        padding: 0.65rem 1rem;
        color: var(--accent-strong);
        font-weight: 700;
        letter-spacing: 0.04em;
        margin-bottom: 1rem;
      }

      .coming-soon p {
        margin: 0;
        color: var(--muted);
        max-width: 480px;
        line-height: 1.7;
      }

      .info-panel {
        padding: 1.4rem;
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        margin-bottom: 1rem;
      }

      .meta-tag {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.12);
        padding: 0.55rem 0.8rem;
        color: var(--accent-strong);
        font-size: 0.8rem;
        font-weight: 700;
      }

      .info-panel h1 {
        margin: 0 0 0.8rem;
        font-size: clamp(1.8rem, 2.7vw, 2.7rem);
        line-height: 1.2;
      }

      .info-panel p {
        margin: 0 0 1rem;
        color: var(--muted);
        line-height: 1.7;
      }

      .recommended-box {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 0.9rem 1rem;
      }

      .recommended-box strong {
        display: block;
        margin-bottom: 0.35rem;
        font-size: 0.78rem;
        color: var(--accent-strong);
        letter-spacing: 0.04em;
      }

      .related-panel {
        margin-top: 2rem;
        padding: 1.3rem;
      }

      .related-panel h2 {
        margin: 0 0 1rem;
        font-size: 1.3rem;
      }

      .related-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1rem;
      }

      .related-card {
        display: block;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 18px;
        overflow: hidden;
        color: var(--text);
        text-decoration: none;
        transition: transform 0.25s ease, border-color 0.25s ease;
      }

      .related-card:hover {
        transform: translateY(-4px);
        border-color: var(--accent);
      }

      .related-thumb {
        aspect-ratio: 16 / 9;
        background-size: cover;
        background-position: center;
      }

      .related-body {
        padding: 0.9rem 0.9rem 1rem;
      }

      .related-body h3 {
        margin: 0 0 0.45rem;
        font-size: 1rem;
      }

      .related-body p {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .empty-note {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 18px;
        padding: 1.5rem;
        color: var(--muted);
      }

      @media (max-width: 980px) {
        .video-shell {
          grid-template-columns: 1fr;
        }

        .related-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 700px) {
        nav {
          padding: 20px 5%;
        }

        .page-hero {
          padding: 1.3rem 1rem;
        }

        .related-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="logo">BREAD</div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="news.html">News</a>
        <a href="videos.html">BREAD Videos</a>
        <a href="request-repair.html">Request a Repair</a>
        <a href="buy-gift-card.html">Buy a Gift Card</a>
        <a href="download.html">Download</a>
      </div>
    </nav>

    <main class="page-shell">
      <section class="page-hero">
        <div class="page-hero-top">
          <div class="brand">BREAD Computer Repair</div>
          <a class="back-btn" href="videos.html">← Back to BREAD Videos</a>
        </div>
      </section>

      <section class="video-shell">
        <div class="video-panel">
          <div id="videoFrame" class="video-frame" aria-live="polite"></div>
        </div>

        <aside id="videoInfo" class="info-panel"></aside>
      </section>

      <section id="relatedPanel" class="related-panel"></section>
    </main>

    <script>
      function slugify(value) {
        return String(value || "")
          .toLowerCase()
          .trim()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      async function fileExists(url) {
        if (!url) return false;
        try {
          const response = await fetch(url, { method: "HEAD" });
          return response.ok;
        } catch (error) {
          return false;
        }
      }

      function getRelatedVideos(video, videos) {
        const selected = videos.filter((item) => item.id !== video.id && item.id !== undefined);
        const sameCategory = selected.filter((item) => item.category === video.category);
        const related = sameCategory.length ? sameCategory : selected;
        return related.slice(0, 3);
      }

      async function renderVideo() {
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get("id");
        const loadedVideos = await fetch("videos.json", { cache: "no-store" }).then((response) => response.ok ? response.json() : []).catch(() => []);
        const videos = Array.isArray(loadedVideos) ? loadedVideos : [];

        const video = videos.find((item) => {
          const itemId = String(item.id || "");
          return itemId === videoId || slugify(item.title) === slugify(videoId || "");
        });

        const videoFrame = document.getElementById("videoFrame");
        const videoInfo = document.getElementById("videoInfo");
        const relatedPanel = document.getElementById("relatedPanel");

        if (!video) {
          videoFrame.innerHTML = `
            <div class="coming-soon">
              <div class="coming-soon-badge">BREAD Video Coming Soon</div>
              <p>This video is being prepared. Check back soon for the finished video.</p>
            </div>
          `;
          videoInfo.innerHTML = `
            <div class="empty-note">
              <p>No BREAD Videos found for this selection.</p>
            </div>
          `;
          relatedPanel.innerHTML = "";
          return;
        }

        const hasVideo = await fileExists(video.video);

        if (hasVideo) {
          videoFrame.innerHTML = `<video controls preload="metadata" src="${video.video}"></video>`;
        } else {
          videoFrame.innerHTML = `
            <div class="coming-soon">
              <div class="coming-soon-badge">BREAD Video Coming Soon</div>
              <p>This video is being prepared. Check back soon for the finished video.</p>
            </div>
          `;
        }

        const date = escapeHtml(video.date || "Coming soon");
        const category = escapeHtml(video.category || "General");
        const title = escapeHtml(video.title || "Untitled video");
        const description = escapeHtml(video.description || "A BREAD video is being prepared.");
        const recommendedIf = escapeHtml(video.recommendedIf || "You want to learn more about BREAD Computer Repair.");

        videoInfo.innerHTML = `
          <div class="meta-row">
            <span class="meta-tag">${category}</span>
            <span class="meta-tag">${date}</span>
          </div>
          <h1>${title}</h1>
          <p>${description}</p>
          <div class="recommended-box">
            <strong>Recommended if:</strong>
            <span>${recommendedIf}</span>
          </div>
        `;

        const relatedVideos = getRelatedVideos(video, videos);

        if (!relatedVideos.length) {
          relatedPanel.innerHTML = "";
          return;
        }

        const relatedHtml = relatedVideos
          .map((item) => {
            const relatedId = encodeURIComponent(item.id || item.title || "video");
            const titleText = escapeHtml(item.title || "Untitled video");
            const desc = escapeHtml(item.description || "A BREAD video is coming soon.");
            const thumb = item.thumbnail || "images/videos/placeholder.svg";
            return `
              <a class="related-card" href="watch-video.html?id=${relatedId}">
                <div class="related-thumb" style="background-image: url('${thumb}')"></div>
                <div class="related-body">
                  <h3>${titleText}</h3>
                  <p>${desc}</p>
                </div>
              </a>
            `;
          })
          .join("");

        relatedPanel.innerHTML = `
          <h2>Related videos</h2>
          <div class="related-grid">${relatedHtml}</div>
        `;
      }

      renderVideo();
    </script>
  </body>
</html>
