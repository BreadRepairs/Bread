<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BREAD Videos</title>
    <style>
      :root {
        --bg: #060b14;
        --text: #f4f7ff;
        --muted: #94a7c6;
        --accent: #2ea8ff;
        --accent-strong: #4ce3ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg);
      }

      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
        padding: 24px 10%;
      }

      .logo {
        color: var(--accent-strong);
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: 0.16em;
      }

      .nav-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem 1.2rem;
      }

      nav a {
        color: var(--text);
        text-decoration: none;
      }

      nav a:hover {
        color: var(--accent);
      }

      main {
        width: min(1200px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 3rem 0;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      #videoDetails {
        color: var(--muted);
        line-height: 1.7;
      }

      #videoDetails h2 {
        color: var(--text);
      }

      #videoDetails ul {
        padding-left: 1.25rem;
      }

      #videoDetails li {
        margin: 0.4rem 0;
      }

      .recommended-label {
        color: var(--accent-strong);
      }

      .back-link {
        display: inline-block;
        margin-top: 1.5rem;
        color: var(--accent-strong);
      }

      @media (max-width: 700px) {
        nav {
          padding: 20px 5%;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="logo">BREAD</div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="news.html">News</a>
        <a href="videos.html">BREAD Videos</a>
        <a href="request-repair.html">Request a Repair</a>
        <a href="buy-gift-card.html">Buy a Gift Card</a>
        <a href="download.html">Download</a>
      </div>
    </nav>

    <main>
      <div id="videoDetails" aria-live="polite">Videos are coming soon. Check back later!</div>
      <a class="back-link" href="videos.html">← Back to BREAD Videos</a>
    </main>

    <script>
      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function getRasterThumbnailUrl(path) {
        if (typeof path !== "string" || !path.trim()) return null;

        try {
          const url = new URL(path, window.location.href);
          const isSiteLocal = url.origin === window.location.origin;
          const isVideosImagePath = /(?:^|\/)images\/videos\/[^/]+\.(?:jpe?g|png|webp)$/i.test(url.pathname);
          return isSiteLocal && isVideosImagePath ? url : null;
        } catch {
          return null;
        }
      }

      function expectedImageMimeType(url) {
        const extension = url.pathname.split(".").pop().toLowerCase();
        if (extension === "jpg" || extension === "jpeg") return "image/jpeg";
        if (extension === "png") return "image/png";
        if (extension === "webp") return "image/webp";
        return null;
      }

      async function fileExists(path, expectedMimeType) {
        if (!path) return false;
        try {
          const response = await fetch(path, { method: "HEAD" });
          const actualMimeType = (response.headers.get("content-type") || "").split(";")[0].trim().toLowerCase();
          return response.ok && (!expectedMimeType || actualMimeType === expectedMimeType);
        } catch {
          return false;
        }
      }

      async function loadVideo() {
        const details = document.getElementById("videoDetails");
        const videoId = new URLSearchParams(window.location.search).get("id");

        try {
          const response = await fetch("videos.json", { cache: "no-store" });
          if (!response.ok) throw new Error("Video data unavailable");
          const data = await response.json();
          const entries = Array.isArray(data) ? data : [];
          const videos = (await Promise.all(entries.map(async (item) => {
            if (!item || !item.id || !item.title || !item.video) return null;
            const thumbnailUrl = getRasterThumbnailUrl(item.thumbnail);
            const thumbnailMimeType = thumbnailUrl && expectedImageMimeType(thumbnailUrl);
            if (!thumbnailUrl || !thumbnailMimeType) return null;
            const [videoExists, thumbnailExists] = await Promise.all([
              fileExists(item.video),
              fileExists(thumbnailUrl.href, thumbnailMimeType)
            ]);
            return videoExists && thumbnailExists
              ? { ...item, thumbnailUrl: thumbnailUrl.href }
              : null;
          }))).filter(Boolean);
          const video = videos.find((item) => String(item.id) === videoId);

          if (!video) {
            details.textContent = "Videos are coming soon. Check back later!";
            return;
          }

          const related = videos.filter((item) =>
            item.id !== video.id && item.category === video.category
          );
          const relatedMarkup = related.length
            ? `<h2>Related videos</h2><ul>${related.map((item) =>
                `<li><a href="watch-video.html?id=${encodeURIComponent(item.id)}">${escapeHtml(item.title)}</a></li>`
              ).join("")}</ul>`
            : "";

          details.innerHTML = `
            <video controls preload="metadata" src="${escapeHtml(video.video)}" poster="${escapeHtml(video.thumbnailUrl)}"></video>
            <h1>${escapeHtml(video.title)}</h1>
            <p>${escapeHtml(video.description)}</p>
            <p>${escapeHtml(video.category)} · ${escapeHtml(video.date)}</p>
            <p><span class="recommended-label">Recommended if:</span> ${escapeHtml(video.recommendedIf)}</p>
            ${relatedMarkup}
          `;
        } catch {
          details.textContent = "Videos are coming soon. Check back later!";
        }
      }

      loadVideo();
    </script>
  </body>
</html>
