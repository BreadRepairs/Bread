<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy a Gift Card | BREAD Computer Repair</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:#09090f;
    color:white;
    font-family:Poppins,sans-serif;
}

.container{
    width:min(1100px,95%);
    margin:auto;
    padding:40px 0;
}

h1{
    color:#00bfff;
    text-align:center;
}

.subtitle{
    text-align:center;
    color:#bfc7d5;
    margin-bottom:40px;
}

.wrapper{
    display:grid;
    grid-template-columns:1fr 380px;
    gap:40px;
}

.card{
    background:#14141d;
    border-radius:20px;
    padding:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
}

input,select,textarea{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#1d1d28;
    color:white;
}

textarea{
    min-height:120px;
}

.values{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin-top:10px;
}

.valueBtn{
    padding:12px;
    background:#1d1d28;
    border:none;
    border-radius:12px;
    color:white;
    cursor:pointer;
    transition:.2s;
}

.valueBtn:hover{
    background:#00bfff;
}

.valueBtn.active{
    background:#00bfff;
}

.submit{
    margin-top:25px;
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:#00bfff;
    color:black;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.preview{
    background:linear-gradient(135deg,#00bfff,#006aff);
    border-radius:25px;
    padding:35px;
    height:240px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    transition:.25s;
}

.preview:hover{
    transform:rotateY(6deg) rotateX(4deg);
}

.preview h2{
    margin:0;
}

.money{
    font-size:55px;
    font-weight:bold;
}

.footer{
    font-size:14px;
}

.status{
    display:none;
    margin-top:20px;
    padding:14px;
    border-radius:12px;
    font-weight:600;
}

.status.success{
    display:block;
    background:#143d26;
    color:#7dffb2;
    border:1px solid #2ecc71;
}

.status.error{
    display:block;
    background:#401919;
    color:#ff8d8d;
    border:1px solid #ff5d5d;
}    

@media(max-width:600px){

.wrapper{
grid-template-columns:1fr;
}

}
</style>

</head>

<body>

<div class="container">

<h1>🎁 Buy a BREAD Gift Card</h1>

<p class="subtitle">
Purchase a Physical Card or E-Card for repairs, cleaning and upgrades.
</p>

<div class="wrapper">

<form id="giftcard-form" class="card">

<label>Name *</label>
<input id="customerName" required>

<label>Email *</label>
<input id="email" type="email" required>

<label>Phone</label>
<input id="phone">

<label>Gift Card Value *</label>

<div class="values">

<button class="valueBtn active">€5</button>
<button class="valueBtn">€10</button>
<button class="valueBtn">€20</button>
<button class="valueBtn">€50</button>
<button class="valueBtn">€100</button>

</div>

<input type="hidden" id="giftValue" value="€5">

<label>Delivery *</label>

<select id="delivery">

    <option>E-Card</option>
    <option>Physical Card</option>

</select>

<label>Gift Message</label>

<textarea id="giftMessage" placeholder="Happy Birthday!"></textarea>

<label>Preferred Delivery Date</label>

<input id="preferredDate" type="date">

<button class="submit" type="button" onclick="window.location.href='services.html'">
    ← Back
</button> 

<button class="submit" type="submit">
    🍞 Purchase BREAD Gift Card →
</button>

<div id="statusBox" class="status"></div>

</form>

<div>

<div class="preview">

<div>

<h2>🍞 BREAD</h2>

Gift Card

</div>

<div class="money" id="money">

€5

</div>

<div class="footer">

Redeem during a repair request.

</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>

emailjs.init({
    publicKey: "Yc3Zc2GwOjL7IU4g6",
});

const form = document.getElementById("giftcard-form");
const buttons = document.querySelectorAll(".valueBtn");
const money = document.getElementById("money");
const giftValue = document.getElementById("giftValue");
const statusBox = document.getElementById("statusBox");
const submitBtn = document.querySelector('button[type="submit"]');

buttons.forEach(btn => {

    btn.addEventListener("click", function(e){

        e.preventDefault();

        buttons.forEach(b => b.classList.remove("active"));

        this.classList.add("active");

        money.textContent = this.textContent;

        giftValue.value = this.textContent;

    });

});

function showStatus(message, success){

    statusBox.textContent = message;

    if(success){

        statusBox.className = "status success";

    }else{

        statusBox.className = "status error";

    }

}

form.addEventListener("submit", function(e){

    e.preventDefault();

    submitBtn.disabled = true;

    submitBtn.textContent = "Sending...";

    const templateParams = {

        customer_name: document.getElementById("customerName").value.trim(),

        email: document.getElementById("email").value.trim(),

        phone: document.getElementById("phone").value.trim() || "Not provided",

        giftcard_value: giftValue.value,

        delivery: document.getElementById("delivery").value,

        gift_message: document.getElementById("giftMessage").value.trim() || "None",

        preferred_date: document.getElementById("preferredDate").value || "Not provided"

    };

    emailjs.send(

        "service_kbaijco",

        "template_zrhptli",

        templateParams

    )

    .then(function(){

        showStatus("✅ Gift card purchase request sent successfully!", true);

        form.reset();

        giftValue.value = "€5";

        money.textContent = "€5";

        buttons.forEach(b => b.classList.remove("active"));

        buttons[0].classList.add("active");

    })

    .catch(function(error){

        console.error(error);

        showStatus("❌ Failed to send gift card purchase request.", false);

    })

    .finally(function(){

        submitBtn.disabled = false;

        submitBtn.textContent = "🍞 Purchase BREAD Gift Card →";

    });

});

</script>

</body>

</html>
